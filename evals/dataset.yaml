# 评测数据集：30 个带标注的样本。怎么跑、怎么加样本见 evals/README.md。
# materials 是切片教材的 sha256，内容一变标注的页码就失效，脚本会直接报错退出。
samples:
- id: qa-001
  category: cited_qa
  course: 大语言模型
  scope: course
  question: Self-Instruct 把新生成的指令加进指令池之前会做哪些过滤？
  expected:
    answer_points:
    - 先与池中已有指令算 ROUGE-L 相似度，只有全部低于 0.7 才可能入池
    - 另有启发式规则筛掉含特定关键词（如「图片」）的、重复的、过长或过短的数据
    - 相似度过滤是为了多样性，启发式规则是为了质量
    forbidden_claims: []
    citations:
      document: llm-指令数据集.pdf
      must_include_pages:
      - 5
      acceptable_pages:
      - 4
      - 3
      forbidden_pages: []
    workflow:
      must_call:
      - search_materials
      must_not_call:
      - web_search
      - plan_update
      - note_write
      max_tool_calls: 5
      required_order: []
  notes: llm-指令数据集.pdf p.5 开头「4. 过滤低质量数据」一段把两件事都写全了：ROUGE-L 相似度低于 0.7 才可能加入指令池、以及删除含「图片」等关键词/重复/过长过短的启发式规则。p.4
    是上一步的 「输入优先/输出优先」提示模板，p.3 是前两步，都不含过滤规则，只作相邻页。单页即可答全。
- id: qa-002
  category: cited_qa
  course: 操作系统
  scope: course
  question: 作业不是同时到达时，SJF 为什么还会出现护航问题？STCF 是怎么把它解决掉的？
  expected:
    answer_points:
    - SJF 不可抢占，先跑起来的长作业会让后到的短作业一直等，平均周转时间被拉到 103.33 秒
    - STCF 允许抢占：新作业到达时比较剩余时间，最短的先跑
    - 同一组作业下 STCF 把平均周转时间降到 50 秒
    forbidden_claims: []
    citations:
      document: os-cpu-scheduling.pdf
      must_include_pages:
      - 5
      - 6
      acceptable_pages:
      - 3
      - 4
      forbidden_pages: []
    workflow:
      must_call:
      - search_materials
      must_not_call:
      - web_search
      - plan_update
      - note_write
      max_tool_calls: 6
      required_order: []
  notes: os-cpu-scheduling.pdf p.5 图 7.4 那段给出 A 在 t=0 需 100 秒、B/C 在 t=10 各需 10 秒时纯 SJF 的平均周转 103.33 秒，并点明仍是
    convoy 问题；p.6 首段讲 STCF 在新作业到达时抢占 A，平均周转 降到 50 秒。两页各答一半，缺任一页都答不全。p.3 是 FIFO 的护航效应、p.4 是 SJF 原则，属背景。
- id: qa-003
  category: cited_qa
  course: 深度学习
  scope: course
  question: 批量规范化在训练模式和预测模式下有什么不一样，预测时的均值方差是怎么来的？
  expected:
    answer_points:
    - 训练时用当前小批量的均值和标准差做规范化
    - 预测时改用整个数据集的统计量，常用移动平均在训练中估算出来
    - 训练时拿不到全数据集统计量，只能用小批量，这个噪声本身还带正则化作用
    forbidden_claims: []
    citations:
      document: 深度学习-批量规范化.pdf
      must_include_pages:
      - 2
      - 3
      acceptable_pages:
      - 4
      - 8
      forbidden_pages: []
    workflow:
      must_call:
      - search_materials
      must_not_call:
      - web_search
      - plan_update
      - note_write
      max_tool_calls: 6
      required_order: []
  notes: 深度学习-批量规范化.pdf p.2 末段明确区分「训练模式」（小批量统计）与「预测模式」（数据集统计）， 并在前一段讲噪声估计反而有益；p.3 的「预测过程中的批量规范化」小节给出具体做法：用移动平均估算
    整个训练集的均值方差，预测时用它得到确定输出。p.4 的 batch_norm 代码里 if not autograd.is_training() 是同一件事的实现，p.8 小结复述一句，二者作相邻页。
- id: qa-004
  category: cited_qa
  course: 大语言模型
  scope: course
  question: LoRA 是怎么用低秩矩阵模拟参数更新的？写出它的前向公式，并说明 A、B 为什么这样初始化。
  expected:
    answer_points:
    - 冻结预训练权重 W0，在旁路加两个低秩矩阵的乘积 ΔW = BA 作为可训练参数，秩 r 远小于 d 和 k
    - 前向是 h = W0x + BAx，即原权重输出加旁路输出
    - A 用高斯初始化、B 用零初始化，使训练开始时旁路输出为 0，不影响原模型
    forbidden_claims: []
    citations:
      document: llm-微调-LoRA.pdf
      must_include_pages:
      - 1
      acceptable_pages:
      - 2
      - 4
      forbidden_pages: []
    workflow:
      must_call:
      - search_materials
      must_not_call:
      - web_search
      - plan_update
      - note_write
      max_tool_calls: 5
      required_order: []
  notes: llm-微调-LoRA.pdf p.1 的 5.2.1 节把三点都写了：W0∈R^{d×k}、ΔW=BA、B∈R^{d×r}、A∈R^{r×k}； A 通过高斯函数初始化、B 零初始化，使训练开始前旁路对原模型不造成影响；式
    (5.2) h=W0x+ΔWx= W0x+BAx。p.2 是图 5.3 与 peft 用法（含 lora_alpha/r 放缩系数），p.4 给 r=4 时的实验数据， 都是延伸不是答案本体。
- id: qa-005
  category: cited_qa
  course: 机器学习数学
  scope: course
  question: 一元高斯和多元高斯的密度函数分别怎么写？标准正态是其中哪种特例？
  expected:
    answer_points:
    - 一元密度是 p(x|μ,σ²) = (2πσ²)^(-1/2) exp(-(x-μ)²/(2σ²))
    - 多元密度是 p(x|μ,Σ) = (2π)^(-D/2)|Σ|^(-1/2) exp(-½(x-μ)ᵀΣ⁻¹(x-μ))，由均值向量和协方差矩阵完全确定
    - 均值为 0、协方差为单位矩阵的高斯就是标准正态分布
    forbidden_claims: []
    citations:
      document: math-gaussian.pdf
      must_include_pages:
      - 5
      acceptable_pages:
      - 4
      forbidden_pages: []
    workflow:
      must_call:
      - search_materials
      must_not_call:
      - web_search
      - plan_update
      - note_write
      max_tool_calls: 5
      required_order: []
  notes: math-gaussian.pdf p.5 上给出式 (6.62) 一元密度与式 (6.63) 多元密度，并在同页末尾写明 μ=0、Σ=I 的特例叫 standard normal distribution。p.4
    是 6.5 节开头讲高斯为什么重要， 没有公式本体，只作相邻页。
- id: qa-006
  category: cited_qa
  course: 机器学习数学
  scope: course
  question: 图 6.9 那个二元高斯的例子里，给定 x2 = -1 时 x1 的条件分布是什么？边缘分布 p(x1) 又是多少？
  expected:
    answer_points:
    - 条件分布是 N(0.6, 0.1)
    - 边缘分布 p(x1) 是 N(0, 0.3)，即直接取联合分布里 x1 的均值和方差
    - 条件均值和条件方差是把联合分布的分块参数代入条件公式算出来的
    forbidden_claims: []
    citations:
      document: math-gaussian.pdf
      must_include_pages:
      - 7
      acceptable_pages:
      - 6
      forbidden_pages: []
    workflow:
      must_call:
      - search_materials
      must_not_call:
      - web_search
      - plan_update
      - note_write
      max_tool_calls: 5
      required_order: []
  notes: math-gaussian.pdf p.7 的 Example 6.6 紧挨着图 6.9 的图注：给定 p(x1,x2)=N([0,2], [[0.3,-1],[-1,5]])，代入 (6.66)(6.67)
    得 μ=0.6、σ²=0.1，式 (6.72)(6.73) 写出 p(x1|x2=-1)=N(0.6,0.1) 与 p(x1)=N(0,0.3)。p.6 是被代入的两个公式本体，引了不罚。 这条也顺带考图注附近的文本能不能被检索到。
- id: qa-007
  category: cited_qa
  course: 操作系统
  scope: course
  question: 多级反馈队列具体是按什么规则调整作业优先级的？
  expected:
    answer_points:
    - 先说明当前课程资料里没有这部分内容，教材只提到它是下一章的主题
    - 明确标注接下来的说法不是教材结论（用通用知识回答）
    - 通用知识部分说清 MLFQ 用多个优先级队列，按作业的实际行为调整优先级：用满时间片就降级，交互性强或让出 CPU 的留在高优先级
    forbidden_claims:
    - 把 MLFQ 的具体调整规则说成本教材里讲过的内容
    citations:
      document: os-cpu-scheduling.pdf
      must_include_pages: []
      acceptable_pages:
      - 11
      forbidden_pages: []
    workflow:
      must_call:
      - search_materials
      must_not_call:
      - plan_update
      - note_write
      max_tool_calls: 6
      required_order: []
  notes: os-cpu-scheduling.pdf 这 13 页只讲到 FIFO/SJF/STCF/RR 与 I/O 处理；p.11 小结的最后一句只说 multi-level feedback
    queue 是下一章的主题，没有任何规则。全文 grep「MLFQ」0 命中， 「feedback queue」只有那一处前向引用。所以正确行为是先查、再说明教材没有、然后以 「以下不是当前教材结论：」给通用知识。must_include_pages
    故意留空。换两三种说法确认教材里确实 没有是合理的，所以 max_tool_calls 比普通 cited_qa 多留一次；web_search 不禁， 系统提示词允许教材没有时联网补。
