- id: synth-005
  category: global_synthesis
  course: 大语言模型
  scope: course
  question: 这一节里降低微调开销的方法不止一个，LoRA、AdaLoRA、QLoRA 各自省的是哪一部分开销？它们之间是替代还是可以叠加？
  expected:
    answer_points:
    - LoRA 冻结预训练权重 W0，只训练旁路低秩矩阵的乘积 BA，省的是可训练参数量；而且推理时可以把 BA 合并回原权重，不像适配器那样带来额外的推理开销
    - 教材给的量化收益：GPT-3 在 r=4、只给注意力的 Q 与 V 矩阵加旁路时，检查点从 350GB 降到 35MB，训练显存从 1.2TB 降到 350GB，训练速度提高
      25%
    - AdaLoRA 改的是 LoRA 内部的秩分配：按各权重矩阵对下游任务的重要性分数动态调整秩，而不是给所有低秩矩阵指定同一个秩，在更少可训练参数下保持或提高性能
    - QLoRA 没有改 LoRA 的逻辑，而是把预训练模型量化到 4-bit（NF4），再对分块的放缩系数做双重量化、配分页优化器，省的是被冻结的主干那部分显存；它叠加在
      LoRA 之上，效果是 650 亿参数的模型能在单张 48GB GPU 上微调
    forbidden_claims:
    - 说 QLoRA 修改了 LoRA 的低秩旁路逻辑
    citations:
      document: llm-微调-LoRA.pdf
      must_include_pages:
      - 1
      - 6
      acceptable_pages:
      - 2
      - 4
      - 5
      forbidden_pages: []
    workflow:
      must_call:
      - search_materials
      must_not_call:
      - web_search
      - plan_update
      max_tool_calls: 12
      required_order: []
  notes: 全局在于三种方法散在整节里，而「叠加还是替代」这个判断要同时读到 LoRA 的结构和 QLoRA 那句「并没有对 LoRA 的逻辑作出修改」才能下。LoRA
    本体（W0 冻结、ΔW=BA、可合并因此无额外推理开销）在 llm-微调-LoRA.pdf p.1；lora_alpha/r 放缩在 p.2；r=4 时 GPT-3 的检查点
