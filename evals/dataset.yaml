    - 计划已经写进系统，并把结果告诉用户（不是把条目列出来反问「可以吗」）
    - 条目覆盖到 8 月 12 日之前，且覆盖了这一章的主要内容（FIFO/SJF/STCF/RR 等）
    - 每天的任务量与「每天一小时」相称
    forbidden_claims:
    - 声称写入成功但实际没有调用过 plan_update
    citations:
      document: null
      must_include_pages: []
      acceptable_pages: []
      forbidden_pages: []
    workflow:
      must_call:
      - get_plan
      - plan_update
      must_not_call:
      - emit_evidence
      max_tool_calls: 9
      required_order:
      - - get_plan
        - plan_update
  notes: 问法含「复习计划」，命中 service.py 的 _PLAN_INTENT（关键词「计划」），写计划的闸门放行—— 已逐词核对过。get_plan 早于 plan_update 是产品明写的前置：plan_update
    的必填参数 expected_version 由 get_plan 报出，工具说明与系统提示词都要求先读再写（get_plan 同时给出弱项与 到期复习信号）。考试日期与每日时长都给全了，不需要先反问。判据落在用户能感知的性质上
    （覆盖到考试日、覆盖这一章内容），不落在条目数或标题文本——plan_update 的契约是重写今天及以后 的全部条目，标题本来就会变。
