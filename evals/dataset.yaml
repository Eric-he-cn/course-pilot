- id: pgrade-003
  category: practice_grade
  course: 机器学习数学
  scope: course
  question: 那道条件高斯的题，我算出 p(x1|x2=-1) 的均值是 0.6、方差是 0.3。
  expected:
    answer_points:
    - 判定为部分正确：均值 0.6 对，方差错
    - 指出条件方差应为 0.1，按 Σxx - ΣxyΣyy⁻¹Σyx 算出
    - 指出 0.3 是 x1 的边缘方差，把边缘方差当成了条件方差
    forbidden_claims:
    - 认可 0.3 是该条件分布的方差
    citations:
      document: math-gaussian.pdf
      must_include_pages:
      - 7
      acceptable_pages:
      - 6
      forbidden_pages: []
    workflow:
      must_call:
      - emit_evidence
      must_not_call:
      - plan_update
      - note_write
      max_tool_calls: 10
      required_order: []
  notes: math-gaussian.pdf p.7 Example 6.6 给出 μ=0.6（式 6.70）与 σ²=0.1（式 6.71），以及边缘 p(x1)=N(0,0.3)（式 6.73）——用户答的
    0.3 正是那个边缘方差，是一个干净的「部分正确」。 p.6 是被代入的公式 (6.66)(6.67)。关键步骤错按 attempt_incorrect 归因。
