    夹在大段 peft 代码里，问句又没提实验数据，第 2 条要点很可能召回不到；第 3 条要点也要靠单独一次检索才能拿到。
- id: synth-006
  category: global_synthesis
  course: 机器学习数学
  scope: course
  question: 这份材料反复在强调高斯分布「算完还是高斯」，具体有哪几类运算满足这一条？教材为什么把这条性质看得这么重？
  expected:
    answer_points:
    - 联合高斯的边缘分布和条件分布都还是高斯，而且有闭式表达：条件均值与条件协方差由分块参数算出，边缘分布直接取对应那一块的均值与协方差
    - 两个高斯密度的乘积是一个被常数放缩的高斯；两个独立高斯随机变量之和也还是高斯，均值与协方差各自相加
    - 任何线性／仿射变换后仍然是高斯（y=Ax 的均值是 Aµ、协方差是 AΣAᵀ），从标准正态采样出一般高斯正是靠这条，配合协方差矩阵的 Cholesky 分解
    - 教材把这类性质概括成「闭合性」，并列为挑选分布时的第一条要求——运算做完还返回同类型的对象，推断才能闭式算出来，这也是它接着引出指数族的理由
    forbidden_claims: []
    citations:
      document: math-gaussian.pdf
      must_include_pages:
      - 8
      - 12
      acceptable_pages:
      - 5
      - 6
      - 7
      - 10
      - 11
      forbidden_pages: []
    workflow:
      must_call:
      - search_materials
      must_not_call:
      - web_search
      - plan_update
      max_tool_calls: 12
      required_order: []
  notes: 全局在于「闭合性」这个词只在最后一节出现，而支撑它的四五条性质散在前面七八页，教材从没在一处列全。math-gaussian.pdf p.5 末段说高斯之所以好用是因为边缘与条件有闭式表达；p.6
    的 (6.65)-(6.68) 给出条件与边缘仍是高斯；p.7 是 Example 6.6 的数值；p.8 的 6.5.2 给出两个高斯密度之积是放缩后的高斯、6.5.3
    给出独立高斯之和仍是高斯；p.10 给出线性变换后 p(y)=N(Aµ, AΣAᵀ)；p.11 是反向变换与 6.5.4 采样（Cholesky）；p.12 的 6.6
    节开头把这件事明确写成「closure property」，列为三条 desiderata 的第一条，并由此引出指数族。must 钉 p.8 与 p.12：一头是性质最密集的地方，一头是教材给出这条性质名字与理由的地方，相隔
    4 页且互不相邻。预期当前版本在检索召回与答案要点上一起失败：「算完还是高斯」在原文里没有对应字面（原文是英文的 closure property），检索大概率只落在
    6.5.1 条件／边缘那一段，第 4 条要点缺失，第 2、3 条也可能只答一半。
